name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
      - name: Install project and audit tools
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
      - name: Test application
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile and lint
        run: |
          python -m compileall -q src tests
          ruff check .
          ruff format --check .
          node --check src/veil_garden/static/app.js
      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r requirements.txt --no-deps
          python -m pip_audit -r requirements-dev.txt
      - name: Run medium/high static security checks
        run: bandit -q -ll -r src/veil_garden
      - name: Scan source for secrets
        run: |
          detect-secrets scan --all-files . > /tmp/detect-secrets.json
          python - <<'PY'
          import json

          with open("/tmp/detect-secrets.json", encoding="utf-8") as handle:
              report = json.load(handle)
          ignored = {".git/", ".ruff_cache/", "__pycache__/", "build/", "dist/"}
          results = {
              path: items
              for path, items in report["results"].items()
              if not any(part in path.replace("\\", "/") for part in ignored)
          }
          findings = sum(len(items) for items in results.values())
          if findings:
              for filename, items in sorted(results.items()):
                  for item in items:
                      print(f"{filename}:{item['line_number']}: {item['type']}")
              raise SystemExit(f"detect-secrets found {findings} unresolved result(s)")
          PY
      - name: Build and inspect Wheel
        run: |
          python -m build --wheel
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
          assert any(name.endswith("veil_garden/static/index.html") for name in names)
          forbidden = (".env", ".sqlite", ".log", "server.txt", "account")
          assert not [name for name in names if any(part in name.lower() for part in forbidden)]
          PY
      - name: Verify public assets and links
        run: |
          python - <<'PY'
          import re
          import struct
          from pathlib import Path
          from urllib.parse import unquote

          def png_size(path):
              data = path.read_bytes()
              assert data.startswith(b"\x89PNG\r\n\x1a\n")
              assert data[12:16] == b"IHDR"
              return struct.unpack(">II", data[16:24])

          assert png_size(Path("docs/images/social-preview.png")) == (1280, 640)
          assert png_size(Path("docs/images/dashboard.png")) == (1280, 720)
          assert Path("docs/images/social-preview.png").stat().st_size < 1_000_000
          assert Path("src/veil_garden/static/favicon.ico").stat().st_size > 1_024

          missing = []
          pattern = re.compile(r"!?\[[^\]]*\]\(([^)]+)\)")
          for markdown in Path(".").rglob("*.md"):
              for raw in pattern.findall(markdown.read_text(encoding="utf-8")):
                  target = raw.strip().split("#", 1)[0]
                  if not target or "://" in target or target.startswith(("mailto:", "#")):
                      continue
                  if not (markdown.parent / unquote(target)).resolve().exists():
                      missing.append(f"{markdown}: {raw}")
          assert not missing, "Missing local links:\n" + "\n".join(missing)
          PY

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build hardened image
        run: docker build -t veil-garden:test .

