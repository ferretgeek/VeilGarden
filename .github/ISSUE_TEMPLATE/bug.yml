name: Bug report
description: Report a reproducible problem using synthetic data only
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include real aliases, tokens, databases, server addresses, paths, or screenshots with private data.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [Local process, Docker, systemd and reverse proxy, Other]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction with reserved data
      placeholder: Use example.invalid addresses and redact all private values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

